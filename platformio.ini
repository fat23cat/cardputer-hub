[platformio]
default_envs = cardputer-adv

[env]
test_framework = unity
extra_scripts = pre:scripts/build_metadata.py
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --inline-suppr
    ; Dependency headers are pinned and outside this repository's ownership.
    cppcheck: --suppress=*:*/.pio/*
platform_packages =
    tool-cppcheck@1.21100.230717

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 1500000
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_flags =
    -Wall
    -Wextra
    ; ESP32 and M5Stack headers rely on supported GNU language extensions.
    -Werror
lib_deps =
    ; Upstream release 1.2.0, pinned by immutable commit SHA.
    https://github.com/m5stack/M5Cardputer.git#2d4fa6646e4e5b47e0af96214b003aa7b15b8d81
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    z3t0/IRremote@4.7.1

[env:native]
platform = native@1.2.1
test_build_src = yes
lib_deps =
    throwtheswitch/Unity@2.6.1
build_src_filter =
    +<core/>
    +<connectivity/>
    -<hardware/>
    -<main.cpp>
build_flags =
    -std=c++17
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Werror
