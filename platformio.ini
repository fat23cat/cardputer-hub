[platformio]
default_envs = native

[env]
test_framework = unity
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --inline-suppr
    ; Dependency headers are pinned and outside this repository's ownership.
    cppcheck: --suppress=*:*/.pio/*
platform_packages =
    tool-cppcheck@1.21100.230717

[env:native]
platform = native@1.2.1
test_build_src = yes
lib_deps =
    throwtheswitch/Unity@2.6.1
build_src_filter =
    +<core/>
    +<connectivity/>
    -<hardware/>
    -<main.cpp>
build_flags =
    -std=c++17
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Werror
