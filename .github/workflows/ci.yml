name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          python-version: 3.12.14
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore build-tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.espressif
            ~/.platformio
          key: toolchains-${{ runner.os }}-idf-5.5.5-${{ hashFiles('uv.lock', 'platformio.ini', 'main/idf_component.yml', 'dependencies.lock') }}
          restore-keys: |
            toolchains-${{ runner.os }}-idf-5.5.5-

      - name: Install locked tools
        run: |
          uv python install 3.12.14
          uv sync --frozen

      - name: Install ESP-IDF 5.5.5
        run: bash scripts/install_esp_idf.sh "${RUNNER_TEMP}/esp-idf-v5.5.5"

      - name: Run all checks
        run: |
          source "${RUNNER_TEMP}/esp-idf-v5.5.5/export.sh"
          make check

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardputer-hub-${{ github.sha }}
          path: |
            build/cardputer_hub.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 7
