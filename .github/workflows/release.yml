name: Release firmware

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARDPUTER_HUB_BUILD_TYPE: release
      VALIDATED_COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify validated source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATED_COMMIT}"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          python-version: 3.12.14
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore PlatformIO cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('uv.lock', 'platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install locked tools
        run: |
          uv python install 3.12.14
          uv sync --frozen

      - name: Assign semantic version from merged branch
        id: release
        shell: bash
        run: |
          set -euo pipefail
          branch="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${VALIDATED_COMMIT}/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | .head.ref // empty'
          )"
          if [[ -z "${branch}" ]]; then
            echo "No merged pull request found for ${VALIDATED_COMMIT}; skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if version="$(git tag --list | uv run --frozen python scripts/next_release_version.py "${branch}")"; then
            echo "CARDPUTER_HUB_VERSION=${version}" >> "${GITHUB_ENV}"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "Releasing v${version} from ${branch} at ${VALIDATED_COMMIT}."
          else
            status=$?
            if ((status != 3)); then
              exit "${status}"
            fi
            echo "Branch ${branch} does not request a semantic release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate and build release firmware
        if: steps.release.outputs.should_release == 'true'
        run: make check

      - name: Package firmware and checksum
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image="cardputer-hub-v${CARDPUTER_HUB_VERSION}.bin"
          cp .pio/build/cardputer-adv/firmware.bin "dist/${image}"
          cd dist
          sha256sum "${image}" > SHA256SUMS

      - name: Create Git tag and GitHub Release
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CARDPUTER_HUB_VERSION}"
          gh release create "${tag}" \
            dist/cardputer-hub-"${tag}".bin \
            dist/SHA256SUMS \
            --target "${VALIDATED_COMMIT}" \
            --title "Cardputer Hub ${tag}" \
            --generate-notes

      - name: Verify release assets
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CARDPUTER_HUB_VERSION}"
          gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fx "cardputer-hub-${tag}.bin"
          gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fx SHA256SUMS

      - name: Retain only the two newest GitHub Releases
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_number=0
          while IFS=$'\t' read -r published_at release_id tag; do
            release_number=$((release_number + 1))
            if ((release_number > 2)); then
              echo "Deleting GitHub Release ${tag} (${published_at}); preserving its Git tag."
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi
          done < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | [.published_at, (.id | tostring), .tag_name] | @tsv' \
              | sort --reverse
          )
