<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Hub</title>
<style>
:root {
  --bone: #F4F2EC; --ink: #17150F; --blue: #1B4FD0; --vermilion: #E2451E; --leaf: #4CB949;
  --light: #CED0CB; --pale: #DEDBD1; --ordinal: #ABA89D; --field: #FBFAF6; --hover: #ECE9E1;
  --muted: #5F5C53; --quiet: #75726A; --danger-text: #A3300D;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bone); color: var(--ink); font-family: var(--sans); }
body { min-height: 100vh; -webkit-text-size-adjust: 100%; }
a { color: var(--ink); }
button, input, textarea { font: inherit; color: inherit; }
button, a { touch-action: manipulation; }
[hidden] { display: none !important; }
.label { font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.quiet { color: var(--quiet); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.dot { width: 8px; height: 8px; display: inline-block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center;
  font: 600 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--ink);
  background: transparent; color: var(--ink); cursor: pointer; border-radius: 0; text-decoration: none; }
.btn:hover { background: #E8E5DC; }
.btn:disabled { opacity: .35; cursor: not-allowed; background: transparent; }
.btn-primary { background: var(--ink); color: var(--bone); }
.btn-primary:hover { background: #2C2A22; }
.btn-primary:disabled { background: var(--ink); }
.btn-danger { background: var(--vermilion); border-color: var(--vermilion); color: var(--ink); }
.btn-danger:hover { background: #CF3D18; }
.btn-quiet { border-color: transparent; }
.btn-del { border-color: transparent; color: var(--danger-text); }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink); text-decoration: none; }
.icon-btn:hover { border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.input { width: 100%; border: 1px solid var(--ink); background: var(--field); padding: 12px 14px;
  font: 400 16px/1.5 var(--sans); border-radius: 0; }
.input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
.input::placeholder { color: var(--quiet); }
textarea.input { resize: vertical; min-height: 220px; }
.wordmark { font: 700 28px/1 var(--mono); letter-spacing: .04em; color: var(--ink); text-decoration: none; }

/* Header */
.top { position: sticky; top: 0; z-index: 10; background: var(--bone); border-bottom: 1px solid var(--ink); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap;
  gap: 8px 24px; align-items: center; justify-content: space-between; }
.top-left { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid transparent;
  font: 600 13px/1 var(--mono); letter-spacing: .12em; text-decoration: none; color: var(--ink); white-space: nowrap; }
.tab:hover { border-color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bone); }
.top-right { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font: 400 12px/1 var(--mono);
  letter-spacing: .06em; color: var(--muted); }
.linklike { background: none; border: 0; padding: 12px 0; font: 600 12px/1 var(--mono); letter-spacing: .06em;
  color: var(--ink); cursor: pointer; text-decoration: underline; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }

/* Sign-in */
.signin { max-width: 400px; margin: 0 auto; padding: 56px 16px 32px; display: flex; flex-direction: column; gap: 20px; }
.signin h1 { margin: 0; font: 700 64px/.9 var(--mono); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-head { display: flex; justify-content: space-between; }
.error { display: flex; gap: 10px; align-items: center; color: var(--danger-text); font-size: 14px; }
.error .dot { background: var(--vermilion); }

/* Home */
.section-head { display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 1px solid var(--ink); padding-bottom: 10px; margin: 0 0 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 40px; }
.tile { display: flex; flex-direction: column; gap: 16px; min-height: 220px; padding: 20px; border: 1px solid var(--ink);
  text-decoration: none; color: var(--ink); }
.tile:hover { background: var(--ink); color: var(--bone); }
.tile:hover .tile-quiet { color: var(--light); }
.tile-quiet { color: var(--muted); }
.tile-count { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
.tile-count b { font: 700 56px/.85 var(--mono); }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  border-top: 1px solid var(--pale); border-left: 1px solid var(--pale); }
.facts > div { padding: 16px; border-right: 1px solid var(--pale); border-bottom: 1px solid var(--pale); }
.facts dt { font: 600 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; }
.facts dd { margin: 0; font: 400 15px/1.2 var(--mono); display: flex; align-items: center; gap: 8px; word-break: break-all; }

/* Inventory */
.inv { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.pane { border: 1px solid var(--ink); min-width: 0; }
.pane-list { flex: 1 1 320px; }
.pane-edit { flex: 999 1 560px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 61px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--ink); }
.row { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 12px 16px; min-height: 64px; border: 0; border-top: 1px solid var(--pale); background: transparent;
  text-align: left; cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row[aria-current="true"], .row[aria-current="true"]:hover { background: var(--ink); color: var(--bone); border-top-color: var(--ink); }
.row[aria-current="true"] .row-sub, .row[aria-current="true"] .row-ord { color: var(--light); }
.row-ord { font: 400 13px/22px var(--mono); color: var(--quiet); }
.row-name { font-weight: 600; font-size: 15px; line-height: 22px; display: flex; align-items: center; gap: 8px; }
.row-sub { font-size: 13px; line-height: 18px; color: var(--muted); }
.notice { padding: 24px 16px; color: var(--muted); font-size: 15px; line-height: 1.5; }
.editor { padding: 24px; display: flex; flex-direction: column; gap: 24px; }
.editor-name { font-size: 20px; font-weight: 600; }
.meta { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px;
  padding-top: 16px; border-top: 1px solid var(--pale); font-size: 13px; }
.meta dt { font: 600 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.meta dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-top: 1px solid var(--ink); }
.status { display: inline-flex; align-items: center; gap: 8px; font: 400 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.banner { background: var(--vermilion); color: var(--ink); padding: 14px 16px; display: flex; flex-wrap: wrap;
  gap: 12px; align-items: center; justify-content: space-between; font-weight: 500; }
.empty { padding: 96px 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.empty h2, .damaged h2 { margin: 0; font-size: 18px; font-weight: 600; }
.empty p, .damaged p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.damaged { padding: 48px 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; max-width: 520px; }
.back { display: none; }

dialog { border: 1px solid var(--ink); padding: 0; background: var(--bone); color: var(--ink); width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(23, 21, 15, .5); }
.dialog-body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.dialog-body h2 { margin: 0; font-size: 20px; font-weight: 600; }
.dialog-body p { margin: 0; font-size: 15px; line-height: 1.5; color: #3D3A33; }
.dialog-bar { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--ink); }

@media (max-width: 899px) {
  .inv.has-selection .pane-list { display: none; }
  .inv:not(.has-selection) .pane-edit { display: none; }
  .back { display: inline-flex; }
  .pane-list, .pane-edit { flex-basis: 100%; }
  main { padding: 16px 12px 40px; }
  .editor { padding: 16px; }
  .bar { position: sticky; bottom: 0; background: var(--bone); }
}
/* LED Canvas */
.led-layout { display:grid; grid-template-columns:minmax(0,520px) minmax(0,1fr); gap:32px; }
.led-panel-wrap { background:var(--ink); padding:20px; touch-action:none; overscroll-behavior:contain;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.led-panel { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:10px; touch-action:none;
  user-select:none; -webkit-user-select:none; cursor:crosshair; aspect-ratio:1; }
.led-cell { aspect-ratio:1; border-radius:22%; background:#29271F; pointer-events:none; }
.led-panel-wrap.closed { opacity:.55; }
.led-caption { display:flex; justify-content:space-between; gap:12px; margin:12px 0 20px; font-size:13px; color:var(--muted); }
.led-controls { display:flex; flex-direction:column; gap:24px; min-width:0; }
.led-controls section { display:flex; flex-direction:column; gap:12px; }
.led-choices { display:flex; flex-wrap:wrap; gap:8px; }
.led-choice { min-height:44px; border:1px solid var(--ink); background:transparent; padding:10px 14px;
  cursor:pointer; font:600 12px/1.3 var(--mono); letter-spacing:.05em; text-align:left; border-radius:0; }
.led-choice[aria-pressed="true"] { background:var(--ink); color:var(--bone); }
.led-modes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.led-mode-colors { display:flex; gap:3px; margin-top:8px; padding:3px; background:var(--ink); width:max-content; }
.led-mode-colors i { width:8px; height:8px; border-radius:2px; }
.led-mode-note { display:none; }
.led-segments { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid var(--ink); }
.led-segments .led-choice { border:0; display:flex; align-items:center; justify-content:center; gap:8px; }
.led-fade-row { display:flex; gap:8px; } .led-fade-row .led-segments { flex:1; }
.led-modes small { display:block; margin-top:8px; font:400 13px/1.4 var(--sans); letter-spacing:0; color:var(--muted); }
.led-modes [aria-pressed="true"] small { color:var(--light); }
.led-swatches { display:flex; gap:6px; flex-wrap:wrap; }
.led-swatch { width:44px; height:44px; border:3px solid transparent; outline:1px solid var(--pale); cursor:pointer; }
.led-swatch[aria-pressed="true"] { border-color:var(--ink); outline-color:var(--ink); }
.led-note { margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
.led-closed h2 { margin:0 0 10px; font-size:22px; }
.led-closed p { font-size:15px; line-height:1.5; color:var(--muted); }
.led-hover { font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; }
.led-hover input { width:18px; height:18px; accent-color:var(--ink); }
@media (max-width:899px) {
 .led-layout { grid-template-columns:minmax(0,1fr); gap:24px; }
 .led-panel-wrap { padding:14px; } .led-panel { gap:7px; }
 .led-modes { display:flex; flex-wrap:nowrap; overflow-x:auto; margin:0 -12px; padding:0 12px 4px; }
 .led-modes .led-choice { flex:none; min-height:60px; } .led-modes small { display:none; }
 .led-mode-note { display:block; min-height:44px; font-size:15px; }
 .led-hover { display:none; }
}

</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-left">
      <a class="wordmark" href="#/" aria-label="Hub home">HUB</a>
      <nav class="tabs" id="tabs" aria-label="Apps"></nav>
    </div>
    <div class="top-right">
      <span id="network"></span>
      <button class="linklike" id="sign-out" type="button">SIGN OUT</button>
    </div>
  </div>
</header>
<main id="main"></main>

<dialog id="confirm">
  <form method="dialog">
    <div class="dialog-body">
      <span class="label" id="confirm-kicker"></span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
    </div>
    <div class="dialog-bar">
      <button class="btn btn-quiet" value="cancel" id="confirm-cancel">Cancel</button>
      <button class="btn" value="ok" id="confirm-ok">OK</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

const NAME_LIMIT = 32;
const DESCRIPTION_LIMIT = 900;
const RECORD_BYTES = 4096;

const state = { hub: null, signedIn: false };
let pageCleanup = null;
function cleanPage() { if (pageCleanup) pageCleanup(); pageCleanup = null; }

// ---- DOM helpers: user text is only ever set as text, never as markup ----
function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const main = document.getElementById("main");
function show(...nodes) { main.replaceChildren(...nodes); }
// Shows "Loading…" only when the wait is long enough to notice, so a quick
// answer never flashes a placeholder.
async function withLoadingNotice(work, isCurrent) {
  const timer = setTimeout(() => {
    if (isCurrent()) show(h("p", { class: "notice", text: "Loading…" }));
  }, 300);
  try { return await work(); } finally { clearTimeout(timer); }
}
function ordinal(index) { return String(index + 1).padStart(2, "0"); }
function codePoints(text) { return Array.from(text).length; }

// ---- API ----
class ApiError extends Error {
  constructor(status, body) { super("HTTP " + status); this.status = status; this.body = body || {}; }
}
async function api(path, options = {}) {
  const init = { method: options.method || "GET", credentials: "same-origin", headers: {} };
  if (init.method !== "GET") init.headers["X-Hub-Request"] = "1";
  if (options.signal) init.signal = options.signal;
  if (options.body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = typeof options.body === "string" ? options.body : JSON.stringify(options.body);
  }
  let response;
  try { response = await fetch(path, init); }
  catch (error) { throw new ApiError(0, { error: "network" }); }
  let body = null;
  const text = await response.text();
  if (text) { try { body = JSON.parse(text); } catch (error) { body = null; } }
  if (response.status === 401 && path !== "/api/session") { signedOut(); throw new ApiError(401, body); }
  if (!response.ok) throw new ApiError(response.status, body);
  return body;
}
function problemText(error) {
  if (error.status === 0) return "The Cardputer did not answer. Check that this device is still on its Wi-Fi.";
  if (error.status === 503) return "The microSD card is not available. Insert it and try again.";
  if (error.status === 504) return "The Cardputer is busy. Try again.";
  return "The Cardputer refused the request (" + error.status + ").";
}

// ---- Dialog ----
function confirmDialog({ kicker, title, text, ok, danger }) {
  const dialog = document.getElementById("confirm");
  document.getElementById("confirm-kicker").textContent = kicker || "";
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-text").textContent = text;
  const okButton = document.getElementById("confirm-ok");
  okButton.textContent = ok;
  okButton.className = danger ? "btn btn-danger" : "btn btn-primary";
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"), { once: true });
    dialog.returnValue = "cancel";
    dialog.showModal();
    document.getElementById("confirm-cancel").focus();
  });
}

// ---- Shell ----
let dirtyGuard = null; // returns true when leaving would lose edits
// The address the unsaved-edits check last accepted.
let lastHash = location.hash;
// Counts page changes: work that finishes after a newer change must not draw.
let routeSerial = 0;

// Changes the address without a hashchange event, keeping lastHash in step.
function replaceHash(hash) {
  history.replaceState(null, "", hash);
  lastHash = location.hash;
}

// Keeps the caret in the field being typed in across a re-render.
function preservingFocus(render) {
  const active = document.activeElement;
  const id = active && ["name", "description", "search"].includes(active.id) ? active.id : null;
  const start = id ? active.selectionStart : 0;
  const end = id ? active.selectionEnd : 0;
  render();
  const field = id && document.getElementById(id);
  if (field) {
    field.focus();
    field.setSelectionRange(start, end);
  }
}

function signedOut() {
  cleanPage();
  state.signedIn = false;
  state.hub = null;
  dirtyGuard = null;
  resetInventory();
  document.getElementById("top").hidden = true;
  renderSignIn();
}

function renderHeader(appId) {
  const top = document.getElementById("top");
  top.hidden = false;
  const tabs = document.getElementById("tabs");
  const key = state.hub.apps.map((app) => app.id + ":" + app.title).join("|");
  if (tabs.dataset.key !== key) {
    tabs.dataset.key = key;
    tabs.replaceChildren(...state.hub.apps.map((app) =>
      h("a", { class: "tab", href: "#/" + app.id, "data-app": app.id, text: app.title })));
  }
  for (const tab of tabs.children) {
    if (tab.dataset.app === appId) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  const device = state.hub.device;
  const network = device.network + " · " + device.clients + (device.clients === 1 ? " CLIENT" : " CLIENTS");
  const label = document.getElementById("network");
  if (label.textContent !== network) label.textContent = network;
}

async function loadHub() {
  state.hub = await api("/api/hub");
  state.signedIn = true;
}

document.getElementById("sign-out").addEventListener("click", async () => {
  if (dirtyGuard && dirtyGuard() &&
      !(await confirmDialog({ title: "Discard unsaved changes?", text: "The edits have not been saved to the Cardputer.", ok: "Discard" })))
    return;
  try { await api("/api/session", { method: "DELETE" }); } catch (error) { /* signed out either way */ }
  signedOut();
});

function renderSignIn(message) {
  const login = h("input", { class: "input", id: "login", name: "login", type: "text", value: "admin",
    autocomplete: "username", autocapitalize: "none", spellcheck: "false", required: true });
  const password = h("input", { class: "input", id: "password", name: "password", type: "password",
    autocomplete: "current-password", required: true });
  const error = h("div", { class: "error", role: "alert", hidden: !message }, h("span", { class: "dot" }), h("span", { text: message || "" }));
  const submit = h("button", { class: "btn btn-primary", type: "submit", text: "Sign in" });
  const form = h("form", { class: "signin", onsubmit: async (event) => {
      event.preventDefault();
      submit.disabled = true;
      try {
        await api("/api/session", { method: "POST", body: { login: login.value, password: password.value } });
        await loadHub();
        route();
      } catch (failure) {
        submit.disabled = false;
        const text = failure.status === 401 ? "Wrong login or password."
          : failure.status === 429 ? "Too many attempts. Wait 30 seconds and try again."
          : problemText(failure);
        error.hidden = false;
        error.lastChild.textContent = text;
        password.select();
      }
    } },
    h("div", {}, h("span", { class: "label muted", text: "Cardputer Hub" }), h("h1", { text: "HUB" })),
    h("label", { class: "field", for: "login" }, h("span", { class: "label", text: "Login" }), login),
    h("label", { class: "field", for: "password" }, h("span", { class: "label", text: "Password" }), password),
    error, submit,
    h("p", { class: "muted", style: "margin:0;font-size:14px;line-height:1.5",
      text: "The login and password are on the Cardputer's WEB ACCESS screen. Signing in lasts until the Cardputer stops the network." }));
  show(form);
  (login.value ? password : login).focus();
}

// ---- Apps: each web app of the firmware has a tile and a page here ----
const apps = {
  led: {
    icon: () => svgIcon("M3 3h18v18H3z M3 9h18 M3 15h18 M9 3v18 M15 3v18"),
    tile: (summary) => [h("span", { class: "tile-quiet mono", text: summary.open ? "READY · " + summary.fingers + " FINGERS" : "APP CLOSED" }),
      h("span", { class: "tile-quiet", text: "Draw light on the 8 × 8 matrix. Seven color modes, a soft halo and fading trails." })],
    page: (rest, serial) => ledCanvasPage(rest, serial),
  },
  inventory: {

    else if (forbidden(code) || character === "\t") line += " ";

    const page = await api("/api/inventory/records" + (after ? "?after=" + after : ""));
    records.push(...page.records);

async function refreshInventory() {
  let records;
  try { records = await fetchAllRecords(); } catch (error) { return; }
  if (!state.signedIn || !location.hash.startsWith("#/inventory")) return;
  if (isDirty() || inventory.status === "saving" || inventory.status === "deleting") return;
  if (JSON.stringify(records) === JSON.stringify(inventory.records)) return;
  const selected = inventory.selected;
  inventory.records = records;
  if (selected && !findRecord(selected)) {
    selectRecord(null);
    replaceHash("#/inventory");
  } else if (selected) {
    selectRecord(selected);
  }
  preservingFocus(renderInventory);
}

function selectRecord(id) {
  const record = findRecord(id);
  inventory.selected = record ? record.id : null;
  inventory.draft = record && !record.damaged ? { name: record.name, description: record.description } : null;
  inventory.status = "clean";
  inventory.problem = "";

async function inventoryPage(rest, serial) {
  renderHeader("inventory");
  dirtyGuard = isDirty;
  const wanted = rest || null;
  // Coming from another page, as opposed to choosing another record.
  const entering = !main.querySelector(":scope > .inv");
  const cached = inventory.loaded;
  if (!cached) {
    await withLoadingNotice(loadInventory, () => serial === routeSerial);
    if (!state.signedIn || serial !== routeSerial) return;

  if (wanted !== inventory.selected) selectRecord(wanted);

// Updates the Inventory page in place. A new selection swaps the editor and

// and the page keeps its scroll position.
function renderInventory({ list = true } = {}) {
  const wide = window.matchMedia("(min-width: 900px)").matches;
  if (wide && !inventory.selected && inventory.records.length) {
    selectRecord(inventory.records[0].id);
    replaceHash("#/inventory/" + inventory.selected);
  }
  const root = main.querySelector(":scope > .inv");
  if (!root) {
    show(h("div", { class: "inv" + (inventory.selected ? " has-selection" : "") }, listPane(), editorPane()));
    return;
  }
  const scroll = window.scrollY;
  const wasShowingList = !root.classList.contains("has-selection");
  root.classList.toggle("has-selection", !!inventory.selected);
  if (list) {
    root.querySelector(".pane-list").replaceWith(listPane());
  } else {
    for (const row of root.querySelectorAll(".row[data-id]")) {
      if (row.dataset.id === inventory.selected) row.setAttribute("aria-current", "true");
      else row.removeAttribute("aria-current");

  root.querySelector(".pane-edit").replaceWith(editorPane());
  if (wide) {
    window.scrollTo(0, scroll);
  } else if (inventory.selected && wasShowingList) {
    // Phone: the list is left; remember where it was and open the editor at the top.
    inventory.listScroll = scroll;
    window.scrollTo(0, 0);
  } else if (!inventory.selected && !wasShowingList) {
    window.scrollTo(0, inventory.listScroll || 0);

  });
  remove.addEventListener("click", () => deleteRecord(record));

  banner.append(h("span", { style: "flex:1 1 240px" }),
    h("button", { class: "btn", type: "button", text: "Reload", onclick: () => reloadRecord(record.id) }));

  pane.append(banner,
    h("div", { class: "editor" },
      h("label", { class: "field", for: "name" }, h("span", { class: "field-head label" }, "Name", nameCount), name),
      h("label", { class: "field", for: "description" }, h("span", { class: "field-head label" }, "Description", descriptionCount), description),
      problem,
      h("dl", { class: "meta" },
        h("div", {}, h("dt", { text: "TAG ID" }), h("dd", { text: record.id.match(/.{4}/g).join(" ") })),
        h("div", {}, h("dt", { text: "REVISION" }), revision),
        h("div", {}, h("dt", { text: "RECORD SIZE" }), size))),
    h("div", { class: "bar" }, remove, h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, reload, save)));
  if (inventory.status === "conflict")
    banner.firstChild.textContent = "Changed on the Cardputer (revision " + inventory.conflictRevision +
      "). Reload to continue — your text stays below so you can copy it.";
  refresh();
  return pane;
}

// Replaces only the list, keeping the editor, its draft and the caret.
function renderListOnly() {
  const pane = main.querySelector(":scope > .inv .pane-list");
  if (!pane) return;
  const scroll = window.scrollY;
  preservingFocus(() => pane.replaceWith(listPane()));
  window.scrollTo(0, scroll);
}

async function reloadRecord(id) {
  const serial = routeSerial;
  // A reply that arrives after another record was chosen, or the page left,
  // updates the list only; it never replaces the current selection or draft.
  const stillCurrent = () => serial === routeSerial && inventory.selected === id;
  try {
    const fresh = await api("/api/inventory/records/" + id);
    const index = inventory.records.findIndex((record) => record.id === id);
    if (index >= 0) inventory.records[index] = fresh;
    inventory.records = sortRecords(inventory.records);
    if (!stillCurrent()) { renderListOnly(); return; }
    selectRecord(id);
  } catch (error) {
    if (error.status === 401) return;
    if (!stillCurrent()) {
      if (error.status === 404) {
        inventory.records = inventory.records.filter((record) => record.id !== id);
        renderListOnly();
      }
      return;
    }
    if (error.status === 404) {
      inventory.records = inventory.records.filter((record) => record.id !== id);
      selectRecord(null);
      location.hash = "#/inventory";
    } else if (error.status === 422) {
      const index = inventory.records.findIndex((record) => record.id === id);
      if (index >= 0) inventory.records[index] = { id, damaged: true };
      inventory.records = sortRecords(inventory.records);
      selectRecord(id);
    } else {
      inventory.status = "error";
      inventory.problem = problemText(error);
    }
  }
  renderInventory();
}

async function deleteRecord(record) {
  const name = record.damaged ? "Damaged record" : record.name;
  const confirmed = await confirmDialog({ kicker: "Delete", title: "Delete “" + name + "”?",
    text: "Its record is removed from the Cardputer’s microSD card for good. Erase the tag on the Cardputer to reuse it.",
    ok: "Delete", danger: true });
  if (!confirmed) return;
  inventory.status = "deleting";
  try {
    await api("/api/inventory/records/" + record.id + "?revision=" + (record.damaged ? 0 : record.revision), { method: "DELETE" });
  } catch (error) {
    if (error.status === 401) return;
    if (error.status === 409) {
      inventory.status = "conflict";
      inventory.conflictRevision = error.body && error.body.revision || 0;
      renderInventory();
      return;
    }
    if (error.status !== 404) {
      inventory.status = "error";
      inventory.problem = problemText(error);
      renderInventory();
      return;
    }
  }
  const index = inventory.records.indexOf(record);
  inventory.records = inventory.records.filter((each) => each !== record);
  const next = inventory.records[Math.min(index, inventory.records.length - 1)];
  const wide = window.matchMedia("(min-width: 900px)").matches;
  selectRecord(wide && next ? next.id : null);
  replaceHash(inventory.selected ? "#/inventory/" + inventory.selected : "#/inventory");
  renderInventory();
}

// ---- Routing ----
async function route() {
  cleanPage();
  if (!state.signedIn) return;
  const serial = ++routeSerial;
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const appId = parts[0] || "";
  if (!appId) {
    dirtyGuard = null;
    const shown = JSON.stringify(state.hub);
    renderHome();
    try { await loadHub(); } catch (error) { return; }
    if (serial === routeSerial && JSON.stringify(state.hub) !== shown) renderHome();
    return;
  }
  const app = apps[appId];
  if (!app || !state.hub.apps.some((known) => known.id === appId)) { location.hash = "#/"; return; }
  await app.page(parts.slice(1).join("/"), serial);
}

window.addEventListener("hashchange", async () => {
  // Leaving the editor with unsaved edits asks first; a refusal restores the address.
  const leavingRecord = lastHash.startsWith("#/inventory/") && location.hash !== lastHash;
  if (leavingRecord && dirtyGuard && dirtyGuard()) {
    const target = location.hash;
    history.replaceState(null, "", lastHash);
    if (!(await confirmDialog({ title: "Discard unsaved changes?", text: "The edits have not been saved to the Cardputer.", ok: "Discard" })))
      return;
    selectRecord(null);
    history.replaceState(null, "", target);
  }
  lastHash = location.hash;
  route();
});
window.addEventListener("beforeunload", (event) => {
  if (dirtyGuard && dirtyGuard()) { event.preventDefault(); event.returnValue = ""; }
});
let wasWide = window.matchMedia("(min-width: 900px)").matches;
window.matchMedia("(min-width: 900px)").addEventListener("change", (event) => {
  if (event.matches !== wasWide && location.hash.startsWith("#/inventory") && inventory.loaded) renderInventory();
  wasWide = event.matches;
});

(async function start() {
  try {
    await loadHub();
    route();
  } catch (error) {
    if (error.status !== 401) renderSignIn(problemText(error));
  }
})();
</script>
</body>
</html>
